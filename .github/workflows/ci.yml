name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Appointment.Tests
        env:
          SkipSpa: "true"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appointment.client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: appointment.client/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      - run: npm run e2e

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
